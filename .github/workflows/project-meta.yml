# Verifies the link-preview card and icon set on every push, the same check
# the pre-push hook runs locally. A stale project.meta.json only warns.
#
# Installed by the portfolio meta toolkit; edit the template there.
name: Project metadata

on:
  push:
  pull_request:

jobs:
  card-and-icons:
    name: Card, icons and metadata are current
    # Self-hosted (owner's decision, 2026-10-13): GitHub-hosted jobs are refused while the
    # account's Actions billing is suspended, so Linux jobs run on the owner's own ARM64 boxes
    # (the Kinhank and the tablet, Debian in proot, one runner per repo on each).
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The check needs no dependencies: it compares files and head tags only.
      - run: node scripts/refresh-project-meta.mjs --check --no-shots --warn-meta
      # The media contract: screenshots that show the app, trailers recorded
      # and within their limits, metadata that lists them.
      - run: node --test scripts/project-media.test.mjs
