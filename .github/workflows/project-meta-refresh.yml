# After every deployment of the production branch, photograph the live site,
# publish the link-preview card, render the icons, regenerate
# project.meta.json and commit the result back. The portfolio pulls
# project-media/ from this branch on its own schedule.
#
# The bot's own commit is tagged [meta-bot] and is pushed with GITHUB_TOKEN, so
# it never re-triggers this workflow; Cloudflare still redeploys it, which is
# how the new og-image.jpg goes live.
#
# Installed by the portfolio meta toolkit; edit the template there.
name: Refresh project metadata

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: project-meta-refresh
  cancel-in-progress: false

permissions:
  contents: write
  checks: read

jobs:
  refresh:
    name: Screenshots, card, icons and metadata
    if: ${{ !contains(github.event.head_commit.message, '[meta-bot]') }}
    runs-on: ubuntu-latest
    # Cloudflare queues builds account-wide, so a burst of pushes can hold one
    # deployment for well over half an hour before it even starts.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # If Cloudflare never deploys (a failed build, a blocked account, no check at
      # all) this does not fail the run: the screenshots are kept and the card,
      # icons and metadata still refresh. Screenshots are then retaken from the PC
      # against the tailnet-hosted build (hosted-failover) instead.
      - name: Wait for the Cloudflare Pages deployment of this commit
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "waiting for Cloudflare Pages to deploy $sha"
          for i in $(seq 1 180); do
            state=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" \
              -q '[.check_runs[] | select(.name | startswith("Cloudflare Pages"))] | first | "\(.status) \(.conclusion)"' 2>/dev/null || true)
            echo "  $i: ${state:-no check yet}"
            case "$state" in
              "completed success") echo "deployed"; sleep 45; echo "deployed=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              "completed failure"|"completed cancelled"|"completed timed_out")
                echo "::warning::Cloudflare build failed; refreshing without new screenshots"
                echo "deployed=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            # No check-run after 10 minutes means Cloudflare is not building this repo
            # at all (blocked account, disconnected project): do not wait two hours.
            if [ "$i" -ge 20 ] && [ -z "$state" ]; then
              echo "::warning::no Cloudflare Pages check appeared; refreshing without new screenshots"
              echo "deployed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 30
          done
          echo "::warning::gave up waiting for the deployment; refreshing without new screenshots"
          echo "deployed=false" >> "$GITHUB_OUTPUT"

      - name: Install a browser for the screenshots
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium

      - name: Refresh screenshots, card, icons and metadata
        env:
          PORTFOLIO_ROOT: /tmp/pw
        run: |
          if [ "${{ steps.deploy.outputs.deployed }}" = "true" ]; then
            node scripts/refresh-project-meta.mjs
          else
            node scripts/refresh-project-meta.mjs --no-shots
          fi

      - name: Commit what changed
        run: |
          git config user.name "project-meta bot"
          git config user.email "project-meta-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Refresh screenshots, card, icons and metadata [meta-bot]"
          git push origin HEAD:master
